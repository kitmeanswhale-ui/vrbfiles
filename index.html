<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Карта архива для DeepSeek</title></head>
<body>
<pre id="map">Загрузка ссылок...</pre>
<script>
    // Код сам автоматически находит ваше имя пользователя и название проекта!
    const path = window.location.pathname.split('/');
    const user = window.location.hostname.split('.')[0];
    const repo = path[1] || "";
    const base = `https://githubusercontent.com{user}/${repo}/main/`;

    // Список всех ваших 22 файлов строго по порядку
    const files = [
        "2010_VRB_01_Location.md", "2010_VRB_02_Household.md", "2010_VRB_03_Sensory.md",
        "2010_VRB_04_Characters_Family.md", "2010_VRB_05_Characters_Neighbors.md", "2010_VRB_06_Characters_Outsiders.md",
        "2010_VRB_07_Psychology.md", "2010_VRB_08_Scenes.md", "2010_VRB_09_Appendices.md",
        "2010_VRB_10_RoomMap.md", "2018_VRB_00_Overview.md", "2018_VRB_01_Location.md",
        "2018_VRB_02_Household.md", "2018_VRB_03_Sensory.md", "2018_VRB_04_Characters_Family.md",
        "2018_VRB_05_Characters_Neighbors.md", "2018_VRB_06_Characters_Outsiders.md", "2018_VRB_07_Psychology.md",
        "2018_VRB_08_Scenes.md", "2018_VRB_09_Appendices.md", "2018_VRB_10_RoomMap_207.md", "Heart.md"
    ];

    let output = "# Карта архива для DeepSeek\nНиже представлены прямые ссылки на файлы. Переходи по ним через Web Search, когда пользователь просит проанализировать конкретную тему.\n\n";
    files.forEach(f => { output += `- ${f}: ${base}${f}\n`; });
    document.getElementById('map').textContent = output;
</script>
</body>
</html>
